name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # id-token: write — was required for the OIDC Trusted Publisher path.
      # Removed because we publish with a Classic Automation NPM_TOKEN (Trusted
      # Publisher setup is gated on TOTP/security-key 2FA on the npm account,
      # which we haven't enabled). Re-add this permission and the --provenance
      # flag below when Trusted Publisher is configured.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
        # No --provenance: it requires the OIDC Trusted Publisher binding, which
        # in turn requires 2FA on the npm account. With the flag, npm answers the
        # PUT with a misleading `404 Not Found` and the publish silently never
        # happens — that is why v2.3.0 and v3.0.0 were tagged but never shipped.
        # Same fix already proven in n8n-nodes-signdocs-brasil.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
